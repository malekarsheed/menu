<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منيو الطلبات</title>
  <style>
    :root{
      --bg:#f7f7f8; --card:#ffffff; --muted:#6b7280; --text:#111827; --brand:#16a34a; --brand-600:#15803d; --border:#e5e7eb; --chip:#f3f4f6;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial; background:var(--bg); color:var(--text)}
    html, body { overflow-x: hidden; }

    .container{max-width:1120px;margin:0 auto;padding:16px}
    header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border)}
    header .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px}
    .brand{display:flex;align-items:center;gap:8px;font-weight:700}
    .brand .logo{width:24px;height:24px;border-radius:6px;background:var(--brand)}

    .search{position:relative;max-width:520px;width:100%}
    .search input{width:100%;padding:12px 40px 12px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff}
    .search .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:.6}

   
    .btn{appearance:none;border:0;background:var(--brand);color:#fff;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
    .btn:hover{background:var(--brand-600)}
    .btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
    .btn-outline:hover{border-color:#cbd5e1}
    .btn-icon{width:36px;height:36px;display:grid;place-items:center}
    #toggleCartBtn{display:inline-flex;align-items:center;gap:6px}
    @media (min-width:992px){ #toggleCartBtn{display:none} } 

    main{display:grid;grid-template-columns:1fr;gap:16px;padding:20px 0}
    @media (min-width:992px){main{grid-template-columns:2fr 1fr;gap:24px}}

    h2{margin:0 0 10px;font-size:18px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}

    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .card-img{height:160px;overflow:hidden}
    .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
    .card:hover .card-img img{transform:scale(1.05)}
    .card-body{padding:12px}
    .row{display:flex;align-items:start;justify-content:space-between;gap:12px}
    .title{font-weight:700}
    .desc{color:var(--muted);font-size:12px;margin:6px 0 0}
    .price{white-space:nowrap;font-weight:700}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .chip{font-size:10px;background:var(--chip);border:1px solid var(--border);padding:4px 8px;border-radius:999px}
    .controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
    .qty{display:flex;align-items:center;gap:8px}

    aside .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px}
    .panel .panel-body{padding:12px}
    .panel .head{display:flex;align-items:center;justify-content:space-between}
    .muted{color:var(--muted);font-size:13px}
    .cart-item{display:flex;gap:10px;align-items:center}
    .cart-item img{width:48px;height:48px;border-radius:10px;object-fit:cover}
    .cart-title{font-size:13px;font-weight:700}
    .cart-line{display:flex;align-items:center;justify-content:space-between}
    .divider{border-top:1px solid var(--border);margin:10px 0}

    aside.drawer{position:fixed; top:0; right:0; width:88vw; max-width:420px; height:100dvh; background:var(--bg); border-left:1px solid var(--border); padding:16px; z-index:50; transform:translateX(100%); transition:transform .3s ease}
    aside.drawer.open{transform:translateX(0)}
    @media (min-width:992px){
      aside.drawer{position:static; width:auto; height:auto; transform:none; border:0; padding:0; background:transparent}
    }
    #backdrop{position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(2px); z-index:45; display:none}
    #backdrop.show{display:block}

    dialog{border:0;border-radius:14px;max-width:640px;width:96vw}
    dialog::backdrop{background:rgba(0,0,0,.3)}
    .d-body{padding:16px}
    .d-row{display:grid;grid-template-columns:1fr 80px 120px;gap:8px;font-size:14px}
    .d-row.head{font-weight:700}

    #printSummary{display:none}
    @media print{ body *{visibility:hidden} #printSummary, #printSummary *{visibility:visible} #printSummary{position:absolute;inset:0;padding:20px;background:#fff} }
    .success{display:none;margin-top:8px;color:#16a34a;font-size:13px}
    .success.show{display:flex;align-items:center;gap:6px}
  </style>
</head>
<body>
  <header>
    <div class="wrap container">
      <div class="brand"><span class="logo"></span><span>منيو</span></div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="ابحث عن طبق، مكوّن أو وسم (مثال: ببروني / نباتي)" />
        <span class="icon">🔎</span>
      </div>

      <button id="toggleCartBtn" class="btn btn-outline">🧺 السلة (<span id="cartBadge">0</span>)</button>
    </div>
  </header>

  <div id="backdrop"></div>

  <div class="container">
    <main>
      <section id="menuList" class="space-y"></section>

      <aside id="cartDrawer" class="drawer">
        <div class="panel">
          <div class="panel-body">
            <div class="head">
              <strong>سلة الطلبات</strong>
              <button class="btn btn-outline" id="clearCartBtn">🗑️ تفريغ</button>
            </div>
            <div id="cartItems" class="space-y" style="margin-top:10px"></div>
            <div class="divider"></div>
            <div class="cart-line"><span class="muted">المجموع</span><strong id="subtotal">0</strong></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-body">
            <strong>بيانات العميل</strong>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
              <input id="clientName" placeholder="اسم العميل" />
              <input id="clientPhone" placeholder="رقم الهاتف" />
              <input id="clientTable" placeholder="رقم الطاولة (اختياري)" />
            </div>
            <textarea id="notes" placeholder="ملاحظات إضافية (درجة الاستواء/بدون مخلل...)" style="width:100%;height:90px;margin-top:10px"></textarea>
            <button id="reviewBtn" class="btn" style="width:100%;margin-top:10px">مراجعة الطلب</button>
            <div id="successMsg" class="success">روح على المطبخ اطبخ الي طلبته وكل ** سيتم تجهيز طلبك بايدك الرجاء عدم الاسراف  </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <dialog id="reviewDialog">
    <div class="d-body">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 style="margin:0">مراجعة وتأكيد</h3>
        <button id="closeDialog" class="btn btn-outline">إغلاق</button>
      </div>
      <div class="divider"></div>
      <div class="d-row head">
        <div>الصنف</div>
        <div>الكمية</div>
        <div style="text-align:right">السعر</div>
      </div>
      <div id="reviewItems" style="margin-top:6px"></div>
      <div class="divider"></div>
      <div class="cart-line"><span>الإجمالي</span><strong id="reviewTotal">0</strong></div>
      <div style="background:#f9fafb;padding:10px;border-radius:10px;margin-top:10px;font-size:14px">
        <div>👤 <b>العميل:</b> <span id="rName">—</span></div>
        <div>📞 <b>الهاتف:</b> <span id="rPhone">—</span></div>
        <div>🍽️ <b>طاولة:</b> <span id="rTable">—</span></div>
        <div>📝 <b>ملاحظات:</b> <span id="rNotes">—</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button id="confirmBtn" class="btn" style="flex:1">تأكيد وإرسال</button>
        <button id="printBtn" class="btn btn-outline" style="flex:1">طباعة الملخّص</button>
      </div>
    </div>
  </dialog>

    function renderMenu(data){
      menuList.innerHTML = '';
      (data || menuData).forEach(group => {
        const section = document.createElement('section');
        const h = document.createElement('h2'); h.textContent = group.category; section.appendChild(h);
        const grid = document.createElement('div'); grid.className = 'grid'; section.appendChild(grid);
        group.items.forEach(item => {
          const card = document.createElement('div'); card.className = 'card'; card.dataset.id = item.id;
          card.innerHTML = `
            <div class="card-img"><img src="${item.img}" alt="${item.name}" loading="lazy"></div>
            <div class="card-body">
              <div class="row">
                <div>
                  <div class="title">${item.name}</div>
                  <div class="desc">${item.desc}</div>
                </div>
                <div class="price">${formatPrice(item.price)}</div>
              </div>
              <div class="chips">${item.tags.map(t=>`<span class="chip">#${t}</span>`).join('')}</div>
              <div class="controls">
                <div class="qty">
                  <button class="btn btn-outline btn-icon" data-action="dec">−</button>
                  <span class="qval" data-qfor="${item.id}" style="width:32px;text-align:center;font-weight:700">${state.cart[item.id]?.qty||0}</span>
                  <button class="btn btn-outline btn-icon" data-action="inc">＋</button>
                </div>
                <button class="btn" data-action="add">أضف للسلة</button>
              </div>
            </div>`;
          grid.appendChild(card);
        });
        menuList.appendChild(section);
      });

    function updateQtyDisplays(){
      document.querySelectorAll('.qval').forEach(span => {

        span.textContent = state.cart[id]?.qty || 0;

      cartBadge.textContent = count;

                <button class="btn btn-outline btn-icon" data-action="dec" data-id="${item.id}">−</button>
                <span style="width:28px;text-align:center;font-weight:700">${qty}</span>
                <button class="btn btn-outline btn-icon" data-action="inc" data-id="${item.id}">＋</button>
              </div>
            </div>
          </div>
        `).join('');
      }
      const subtotal = lines.reduce((s,{item,qty}) => s + item.price*qty, 0);
      subtotalEl.textContent = formatPrice(subtotal);
      updateQtyDisplays();
      updateCartBadge();
    }

    function changeQty(id, delta){
      const cur = state.cart[id]?.qty || 0;
      const next = Math.max(0, cur + delta);
      if(next === 0){ delete state.cart[id]; }
      else {
        const item = state.cart[id]?.item || findItem(id);
        state.cart[id] = { item, qty: next };
      }
      renderCart();
    }

    function addToCart(item){
      const cur = state.cart[item.id]?.qty || 0;
      state.cart[item.id] = { item, qty: cur + 1 };
      renderCart();
    }

    function findItem(id){
      for(const g of menuData){
        const it = g.items.find(x => x.id === id);
        if(it) return it;
      }
      return null;
    }

    menuList.addEventListener('click', (e)=>{
      const card = e.target.closest('.card');
      if(!card) return;
      const id = card.dataset.id;
      if(e.target.matches('[data-action="inc"]')) changeQty(id, +1);
      if(e.target.matches('[data-action="dec"]')) changeQty(id, -1);
      if(e.target.matches('[data-action="add"]')) {
        const item = findItem(id); if(item) addToCart(item);
      }
    });

    cartItems.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-action]');
      if(!btn) return;
      const id = btn.getAttribute('data-id');
      if(btn.dataset.action === 'inc') changeQty(id, +1);
      if(btn.dataset.action === 'dec') changeQty(id, -1);
    });

    clearCartBtn.addEventListener('click', ()=>{ state.cart = {}; renderCart(); });

    function filterMenu(q){
      q = q.trim().toLowerCase();
      if(!q) return menuData;
      const words = q.split(/\s+/).filter(Boolean);
      const matches = (text) => words.every(w => text.includes(w));
      return menuData.map(cat => ({
        category: cat.category,
        items: cat.items.filter(it => matches((it.name + ' ' + it.desc + ' ' + it.tags.join(' ')).toLowerCase()))
      })).filter(cat => cat.items.length>0);
    }
    searchInput.addEventListener('input', (e)=>{
      const filtered = filterMenu(e.target.value);
      renderMenu(filtered);
    });

    reviewBtn.addEventListener('click', ()=>{
      const lines = Object.values(state.cart);
      if(lines.length === 0) return;
      reviewItems.innerHTML = lines.map(({item, qty}) => `
        <div class="d-row" style="margin-top:6px">
          <div>${item.name}</div>
          <div>x${qty}</div>
          <div style="text-align:right">${formatPrice(item.price*qty)}</div>
        </div>
      `).join('');
      const total = lines.reduce((s,{item,qty}) => s + item.price*qty, 0);
      reviewTotal.textContent = formatPrice(total);
      rName.textContent = clientName.value || '—';
      rPhone.textContent = clientPhone.value || '—';
      rTable.textContent = clientTable.value || '—';
      rNotes.textContent = notes.value || '—';
      successMsg.classList.remove('show');
      reviewDialog.showModal();
    });
    closeDialog.addEventListener('click', ()=> reviewDialog.close());

    
    confirmBtn.addEventListener('click', async ()=>{
      const lines = Object.values(state.cart);
      if(lines.length === 0) return;

      const total = lines.reduce((s,{item,qty}) => s + item.price * qty, 0);
      const itemsText = lines.map(({item,qty}) =>
        `${item.name} × ${qty} = ${formatPrice(item.price * qty)}`
      ).join('\n');

      const orderData = {
        _subject: "طلب جديد من المنيو",
        _template: "table",
        "اسم العميل": clientName.value || "غير مذكور",
        "رقم الهاتف": clientPhone.value || "غير مذكور",
        "رقم الطاولة": clientTable.value || "غير مذكور",
        "الطلب": itemsText,
        "الإجمالي": formatPrice(total),
        "الملاحظات": notes.value || "لا يوجد",
        "وقت الطلب": new Date().toLocaleString('ar-JO')
      };

      const originalText = confirmBtn.textContent;
      confirmBtn.disabled = true;
      confirmBtn.textContent = "جاري إرسال الطلب...";

      try {
        const response = await fetch("https://formsubmit.co/ajax/malekarsheed@gmail.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(orderData)
        });

        if(!response.ok) throw new Error("تعذر إرسال الطلب");

        reviewDialog.close();
        successMsg.textContent = "✅ تم إرسال طلبك بنجاح";
        successMsg.classList.add('show');

        state.cart = {};
        renderCart();
        clientName.value = "";
        clientPhone.value = "";
        clientTable.value = "";
        notes.value = "";
      } catch (error) {
        alert("حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى.");
        console.error(error);
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = originalText;
      }
    });

   
    const printbtn = document.getElementById('printBtn');
    printBtn.addEventListener('click', ()=>{
      const lines = Object.values(state.cart);
      const total = lines.reduce((s,{item,qty}) => s + item.price*qty, 0);
      const html = `
        <h2>ملخّص الطلب</h2>
        <div style="margin:6px 0 10px;color:#6b7280">${new Date().toLocaleString('ar-JO')}</div>
        <div style="display:grid;grid-template-columns:1fr 80px 120px;gap:8px;font-size:14px;font-weight:700"><div>الصنف</div><div>الكمية</div><div style="text-align:right">السعر</div></div>
        ${lines.map(({item,qty})=>`<div style=\"display:grid;grid-template-columns:1fr 80px 120px;gap:8px;margin-top:6px\"><div>${item.name}</div><div>x${qty}</div><div style=\"text-align:right\">${formatPrice(item.price*qty)}</div></div>`).join('')}
        <hr style="margin:10px 0"/>
        <div style="display:flex;justify-content:space-between"><span>الإجمالي</span><b>${formatPrice(total)}</b></div>
        <div style="background:#f9fafb;padding:10px;border-radius:10px;margin-top:10px;font-size:14px">
          <div>👤 <b>العميل:</b> ${clientName.value || '—'}</div>
          <div>📞 <b>الهاتف:</b> ${clientPhone.value || '—'}</div>
          <div>🍽️ <b>طاولة:</b> ${clientTable.value || '—'}</div>
          <div>📝 <b>ملاحظات:</b> ${notes.value || '—'}</div>
        </div>`;
      document.getElementById('printSummary').innerHTML = html;
      window.print();
    });

   
    function toggleCartDrawer(force){
      const open = force !== undefined ? force : !cartDrawer.classList.contains('open');
      if(open){
        cartDrawer.classList.add('open');
        backdrop.classList.add('show');
      }else{
        cartDrawer.classList.remove('open');
        backdrop.classList.remove('show');
      }
    }
    toggleCartBtn.addEventListener('click', ()=> toggleCartDrawer());
    backdrop.addEventListener('click', ()=> toggleCartDrawer(false));

    
    function init(){
      renderMenu(menuData);
      renderCart();
      updateCartBadge();
    }
    init();
  </script>
</body>
</html>
